{% extends 'base.html' %}
{% block content %}
<div class="container-fluid p-0 mb-4 mt-2">
    <div class="d-flex align-items-center gap-2 mb-3 px-2">
        <a href="{% url 'request_hub' %}" class="btn btn-light shadow-sm btn-sm px-2 py-1 rounded-3 border bg-white text-secondary">⬅️</a>
        <div>
            <h4 class="fw-bold text-dark mb-0">🧑‍⚕️ Add Doctor</h4>
            <small class="text-muted small">Naya doctor record create karein.</small>
        </div>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="card border-0 shadow-sm bg-white mx-2" style="border-top: 4px solid #6f42c1 !important; border-radius: 12px;">
            <div class="card-body p-3">
                
                <h6 class="fw-bold text-secondary mb-3 border-bottom pb-1" style="font-size: 0.85rem;">📋 BASIC INFO</h6>
                {% if is_manager_view %}
                <div class="mb-3">
                    <label class="form-label fw-bold text-primary">Assign To (Select MR) <span class="text-danger">*</span></label>
                    <select name="allocated_to" class="form-select border-primary" required>
                        <option value="">-- Select Team Member --</option>
                        {% for emp in team_employees %}
                            <option value="{{ emp.id }}">{{ emp.name }} ({{ emp.designation }})</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold mb-1">Doctor Name</label>
                    <input type="text" name="name" class="form-control bg-light border-0 shadow-none fw-bold text-dark" placeholder="Dr. Full Name" style="border-radius: 8px; padding: 10px 15px;" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label text-secondary small fw-bold mb-1">Specialty</label>
                        <select name="specialty" class="form-select bg-light border-0 shadow-none fw-bold text-dark" style="border-radius: 8px; padding: 10px 15px;" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="GP">General Physician (GP)</option>
                            <option value="Gynecologist">Gynecologist</option>
                            <option value="Pediatrician">Pediatrician</option>
                            <option value="Orthopedic">Orthopedic</option>
                            <option value="Cardiologist">Cardiologist</option>
                            <option value="Dermatologist">Dermatologist</option>
                            <option value="Dentist">Dentist</option>
                            <option value="Surgeon">General Surgeon</option>
                            <option value="ENT">ENT Specialist</option>
                            <option value="Physician">Consultant Physician</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label text-secondary small fw-bold mb-1">Degree</label>
                        <select name="degree" class="form-select bg-light border-0 shadow-none fw-bold text-dark" style="border-radius: 8px; padding: 10px 15px;" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="MBBS">MBBS</option>
                            <option value="MD">MD</option>
                            <option value="MS">MS</option>
                            <option value="BAMS">BAMS</option>
                            <option value="BHMS">BHMS</option>
                            <option value="BDS">BDS</option>
                            <option value="MDS">MDS</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold mb-1">Category (A/B/C)</label>
                    <div class="d-flex gap-2">
                        <div class="flex-fill">
                            <input type="radio" class="btn-check" name="category" id="cat_a" value="A">
                            <label class="btn btn-outline-danger w-100 fw-bold rounded-3 shadow-sm py-2" for="cat_a">A</label>
                        </div>
                        <div class="flex-fill">
                            <input type="radio" class="btn-check" name="category" id="cat_b" value="B">
                            <label class="btn btn-outline-warning w-100 fw-bold rounded-3 shadow-sm py-2" for="cat_b">B</label>
                        </div>
                        <div class="flex-fill">
                            <input type="radio" class="btn-check" name="category" id="cat_c" value="C">
                            <label class="btn btn-outline-secondary w-100 fw-bold rounded-3 shadow-sm py-2" for="cat_c">C</label>
                        </div>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label text-secondary small fw-bold mb-1">Mobile No</label>
                        <input type="tel" name="mobile" class="form-control bg-light border-0 shadow-none fw-bold text-dark" placeholder="10-digit number" style="border-radius: 8px; padding: 10px 15px;">
                    </div>
                    <div class="col-6">
                        <label class="form-label text-secondary small fw-bold mb-1">Email</label>
                        <input type="email" name="email" class="form-control bg-light border-0 shadow-none fw-bold text-dark" placeholder="Optional" style="border-radius: 8px; padding: 10px 15px;">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold mb-1">Address / Clinic</label>
                    <textarea name="address" class="form-control bg-light border-0 shadow-none fw-bold text-dark" rows="2" placeholder="Clinic/Hospital address" style="border-radius: 8px; padding: 10px 15px;"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold mb-1">Residential Address</label>
                    <textarea name="residential_address" class="form-control bg-light border-0 shadow-none fw-bold text-dark" rows="2" placeholder="Ghar ka address (optional)" style="border-radius: 8px; padding: 10px 15px;"></textarea>
                </div>

                <h6 class="fw-bold text-secondary mb-3 border-bottom pb-1" style="font-size: 0.85rem;">📍 LOCATION & ROUTE</h6>
                
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold mb-1">Territory</label>
                    <select id="id_territory" name="territory" class="form-select bg-light border-0 shadow-none fw-bold text-primary" style="border-radius: 8px; padding: 10px 15px;" onchange="filterRoutes()" required>
                        <option value="">-- Select Territory --</option>
                        {% for t in territories %}
                            <option value="{{ t.id }}">{{ t.name }} ({{ t.city }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold mb-1">Route</label>
                    <select id="id_route" name="route" class="form-select bg-light border-0 shadow-none fw-bold text-dark" style="border-radius: 8px; padding: 10px 15px;">
                        <option value="">-- Select Route --</option>
                        {% for r in routes %}
                            <option value="{{ r.id }}" data-territory="{{ r.territory.id }}">{{ r.name }} — {{ r.territory.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <h6 class="fw-bold text-secondary mb-3 border-bottom pb-1" style="font-size: 0.85rem;">📸 PHOTOS & DATES (Optional)</h6>
                
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold mb-1">Profile Photo</label>
                    <input type="file" name="photo" class="form-control bg-light border-0 shadow-none fw-bold text-dark" accept="image/*" style="border-radius: 8px; padding: 10px 15px;">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold mb-1">Visiting Card (V-Card)</label>
                    <input type="file" name="vcard_photo" class="form-control bg-light border-0 shadow-none fw-bold text-dark" accept="image/*" style="border-radius: 8px; padding: 10px 15px;">
                </div>

                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label class="form-label text-secondary small fw-bold mb-1">Date of Birth</label>
                        <input type="date" name="dob" class="form-control bg-light border-0 shadow-none fw-bold text-dark" style="border-radius: 8px; padding: 10px 15px;">
                    </div>
                    <div class="col-6">
                        <label class="form-label text-secondary small fw-bold mb-1">Marriage Anniv.</label>
                        <input type="date" name="dom" class="form-control bg-light border-0 shadow-none fw-bold text-dark" style="border-radius: 8px; padding: 10px 15px;">
                    </div>
                </div>

                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label class="form-label text-secondary small fw-bold mb-1">Child 1 DOB</label>
                        <input type="date" name="child_1_dob" class="form-control bg-light border-0 shadow-none fw-bold text-dark" style="border-radius: 8px; padding: 10px 15px;">
                    </div>
                    <div class="col-6">
                        <label class="form-label text-secondary small fw-bold mb-1">Child 2 DOB</label>
                        <input type="date" name="child_2_dob" class="form-control bg-light border-0 shadow-none fw-bold text-dark" style="border-radius: 8px; padding: 10px 15px;">
                    </div>
                </div>

                <h6 class="fw-bold text-secondary mb-3 border-bottom pb-1" style="font-size: 0.85rem;">📍 CLINIC GPS</h6>
                <div class="mb-3">
                    <input type="hidden" name="latitude" id="lat">
                    <input type="hidden" name="longitude" id="lng">
                    <button type="button" id="gpsBtn" class="btn btn-outline-primary w-100 fw-bold py-2 rounded-3 shadow-sm" onclick="captureGPS()">
                        📡 Capture Current Location
                    </button>
                    <div id="gpsStatus" class="text-muted small text-center mt-2 fw-medium" style="font-size:0.75rem;">GPS lock zaroori hai.</div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3 shadow-sm mt-3" style="background-color: #6f42c1; border-color: #6f42c1;">
                    💾 Save Doctor
                </button>
            </div>
        </div>
    </form>
</div>

<script>
function captureGPS() {
    var statusDiv = document.getElementById('gpsStatus');
    var btn = document.getElementById('gpsBtn');
    statusDiv.innerHTML = '⏳ Fetching location...';
    btn.disabled = true;
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                document.getElementById('lat').value = pos.coords.latitude;
                document.getElementById('lng').value = pos.coords.longitude;
                statusDiv.innerHTML = '✅ Location captured: ' + pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5);
                statusDiv.className = 'text-success small text-center mt-2 fw-bold';
                btn.innerHTML = '✅ Location Captured';
                btn.className = 'btn btn-success w-100 fw-bold py-2 rounded-3 shadow-sm';
            },
            function() {
                statusDiv.innerHTML = '⚠️ GPS enable karein.';
                statusDiv.className = 'text-danger small text-center mt-2 fw-bold';
                btn.disabled = false;
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }
}

function filterRoutes() {
    var territoryId = document.getElementById("id_territory").value;
    var routeSelect = document.getElementById("id_route");
    var options = routeSelect.options;

    // Jaise hi territory change ho, purana route clear kar do
    routeSelect.value = "";

    for (var i = 0; i < options.length; i++) {
        var option = options[i];
        
        // Placeholder option ko hamesha dikhao
        if (option.value === "") {
            option.style.display = "block";
            continue;
        }

        var routeTerritoryId = option.getAttribute("data-territory");
        
        // Agar territory match hoti hai, toh dikhao, warna chupao
        if (territoryId === "" || routeTerritoryId === territoryId) {
            option.style.display = "block";
        } else {
            option.style.display = "none";
        }
    }
}

// Page load hone par ek baar run kar lo
document.addEventListener("DOMContentLoaded", function() {
    filterRoutes();
});
</script>
{% endblock %}
