{% extends 'base.html' %}
{% block content %}
<!-- 🌟 FIX: Added mb-5 and pb-5 to create space for the bottom navigation bar -->
<div class="container mt-4 mb-5 pb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0" style="border-radius: 12px;">
                <div class="card-header bg-primary text-white" style="border-radius: 12px 12px 0 0;">
                    <h4 class="mb-0">📝 Create Activity / Event</h4>
                </div>
                <div class="card-body">
                    <!-- enctype="multipart/form-data" bahut zaroori hai photo upload ke liye! -->
                    <form action="{% url 'create_event' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label class="font-weight-bold">Event Subject *</label>
                            <input type="text" name="subject" class="form-control shadow-sm" required placeholder="e.g., Free OPD Camp at City Hospital" style="border-radius: 8px; border: 1px solid #ced4da;">
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold">Category</label>
                            <select name="category" class="form-control shadow-sm" style="border-radius: 8px; border: 1px solid #ced4da;">
                                <option value="Inauguration">Inauguration</option>
                                <option value="Medical Store">Medical Store</option>
                                <option value="CME">CME</option>
                                <option value="OPD Camp">OPD Camp</option>
                                <option value="Doctor RTD">Doctor RTD</option>
                                <option value="Birthday">Birthday</option>
                                <option value="Special Day">Special Day</option>
                                <option value="Other" selected>Other</option>
                            </select>
                        </div>
                        <!-- Optional Doctor / Chemist Links -->
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label class="font-weight-bold text-secondary">Link Doctor (Optional)</label>
                                <select name="doctor" class="form-control shadow-sm" style="border-radius: 8px; border: 1px solid #ced4da;">
                                    <option value="">-- Select Doctor --</option>
                                    {% for doc in doctors %}
                                    <option value="{{ doc.id }}">{{ doc.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="font-weight-bold text-secondary">Link Chemist (Optional)</label>
                                <select name="chemist" class="form-control shadow-sm" style="border-radius: 8px; border: 1px solid #ced4da;">
                                    <option value="">-- Select Chemist --</option>
                                    {% for chem in chemists %}
                                    <option value="{{ chem.id }}">{{ chem.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold">Description</label>
                            <textarea name="description" class="form-control shadow-sm" rows="4" placeholder="Share details about the event..." style="border-radius: 8px; border: 1px solid #ced4da;"></textarea>
                        </div>

                        <div class="form-group bg-light p-3 border shadow-sm" style="border-radius: 8px;">
                            <label class="font-weight-bold">Upload Event Photos</label><br>
                            <input type="file" name="photos" class="form-control-file" multiple accept="image/*">
                            <small class="form-text text-muted mt-1">You can select and upload multiple photos at once.</small>
                        </div>

                        <!-- Toggle Switch for Community Sharing -->
                        <div class="form-group mt-4 p-3 border shadow-sm bg-white" style="border-radius: 8px;">
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="shareCommunity" name="is_shared_in_community" checked>
                                <label class="custom-control-label font-weight-bold text-primary" for="shareCommunity">
                                    📢 Share on Community Wall
                                </label>
                            </div>
                            <small class="text-muted d-block mt-1">If enabled, this event will be visible to all employees on the feed.</small>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg btn-block mt-4 shadow-sm" style="border-radius: 8px; font-weight: bold;">Post Event</button>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- 🌟 FIX: Safe space for bottom navigation bar so nothing gets hidden -->
        <div style="height: 80px;"></div>
    </div>
</div>
{% endblock %}
