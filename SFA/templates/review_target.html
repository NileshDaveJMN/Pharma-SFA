{% extends 'base.html' %}
{% block content %}
<div class="container-fluid p-0 mb-4">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a href="{% url 'manager_approvals' %}" class="btn btn-light shadow-sm btn-sm px-2 py-1 rounded-3 border bg-white">⬅️</a>
        <h4 class="fw-bold text-dark mb-0">🎯 Review Target</h4>
    </div>

    <div class="card border-0 shadow-sm mb-3 bg-white" style="border-left: 4px solid #007bff;">
        <div class="card-body p-3">
            <h6 class="fw-bold text-dark mb-1">{{ target_emp.name }} ({{ target_emp.designation }})</h6>
            <span class="text-secondary small">📅 Month: {{ master.month }} / {{ master.year }}</span>
        </div>
    </div>

    <div class="card border-0 shadow-sm bg-white mb-4">
        <div class="card-body p-0">
            <form method="POST">
                {% csrf_token %}
                <table class="table table-bordered mb-0 align-middle" style="font-size:0.85rem;">
                    <thead class="table-dark">
                        <tr><th class="ps-3">Product Name</th><th class="text-center">Target Qty</th></tr>
                    </thead>
                    <tbody>
                        {% for t in targets %}
                        <tr>
                            <td class="ps-3 fw-bold text-dark">{{ t.product.name }}</td>
                            <td class="text-center p-1">
                                <input type="number" name="target_{{ t.product.id }}" value="{{ t.target_qty }}" class="form-control form-control-sm text-center fw-bold text-primary">
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

                <div class="p-3 bg-light border-top">
                    <label class="form-label text-secondary small fw-bold">Manager Remark</label>
                    <textarea name="manager_remark" class="form-control mb-3" rows="2">{{ master.manager_remark }}</textarea>
                    
                    <button type="submit" name="action" value="Save_Only" class="btn btn-outline-primary w-100 fw-bold mb-2">💾 Modify & Save Changes</button>
                    <div class="d-flex gap-2">
                        <button type="submit" name="action" value="Approve" class="btn btn-success w-50 fw-bold">✅ Approve</button>
                        <button type="submit" name="action" value="Reject" class="btn btn-danger w-50 fw-bold">❌ Reject</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
