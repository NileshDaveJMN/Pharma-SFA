{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0 mb-4 bg-white">
    <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold text-dark" style="font-size: 1.05rem;">Edit Visit: {{ customer_name }}</h5>
        <span class="badge {% if customer_type == 'Doctor' %}bg-primary{% else %}bg-success{% endif %} bg-opacity-10 {% if customer_type == 'Doctor' %}text-primary{% else %}text-success{% endif %} fw-bold px-2 py-1">
            {{ customer_type }}
        </span>
    </div>
    
    <div class="card-body p-3">
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold mb-1">REMARKS (OPTIONAL)</label>
                <textarea name="remark" class="form-control bg-light text-dark fw-medium" rows="2" style="font-size: 0.9rem;">{{ visit.remark }}</textarea>
            </div>

            <h6 class="text-secondary small fw-bold text-uppercase mb-3" style="letter-spacing: 0.5px;">Update Product Details</h6>
            
            {% for item in products_with_data %}
            <div class="card mb-2.5 border bg-light bg-opacity-50 shadow-none rounded-3">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2.5">
                        <strong class="text-dark" style="font-size: 0.9rem;">{{ item.product.name }}</strong>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="detailed_{{ item.product.id }}" id="detailed_{{ item.product.id }}" {% if item.is_detailed %}checked{% endif %}>
                            <label class="form-check-label text-muted small fw-medium" for="detailed_{{ item.product.id }}">Detailed</label>
                        </div>
                    </div>
                    
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="small text-muted mb-1" style="font-size: 0.7rem; font-weight: 600;">Sample Qty</label>
                            <input type="number" name="sample_{{ item.product.id }}" class="form-control text-center fw-bold bg-white" min="0" value="{{ item.sample_qty }}">
                        </div>
                        <div class="col-6">
                            <label class="small text-muted mb-1" style="font-size: 0.7rem; font-weight: 600;">Order Qty</label>
                            <input type="number" name="order_{{ item.product.id }}" class="form-control text-center fw-bold bg-white" min="0" value="{{ item.order_qty }}">
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}

            <div class="d-flex gap-2 mt-4">
                <a href="{% url 'mr_dashboard' %}" class="btn btn-light border w-50 fw-semibold text-secondary py-2.5">Cancel</a>
                <button type="submit" class="btn btn-primary w-50 fw-bold py-2.5">Update Visit</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
