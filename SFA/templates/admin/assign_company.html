{% extends "admin/base_site.html" %}
{% block content %}
<h2>🏢 Assign Company</h2>
<p><strong>{{ queryset.count }}</strong> records selected.</p>

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="{{ action }}">
    {% for obj in queryset %}
        <input type="hidden" name="_selected_action" value="{{ obj.pk }}">
    {% endfor %}

    <div style="margin: 20px 0;">
        <label><strong>Select Company:</strong></label><br><br>
        <select name="company" style="padding: 8px; font-size: 14px; min-width: 250px;">
            <option value="">-- Company Chunein --</option>
            {% for company in companies %}
                <option value="{{ company.id }}">{{ company.name }} ({{ company.code }})</option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" name="apply" value="1" 
        style="background:#417690; color:white; padding:10px 20px; border:none; cursor:pointer; font-size:14px; border-radius:4px;">
        ✅ Assign Karo
    </button>
    &nbsp;
    <a href="../" style="color:#666;">Cancel</a>
</form>
{% endblock %}
