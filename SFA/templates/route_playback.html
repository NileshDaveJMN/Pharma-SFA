{% extends 'base.html' %}

{% block content %}
<!-- Leaflet CSS for Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<div class="container-fluid p-0 mb-4">
    <!-- Header -->
    <div class="d-flex align-items-center gap-2 mb-1 px-1">
        <a href="{% url 'dcr_report' %}" class="btn btn-light shadow-sm btn-sm px-2.5 py-1 rounded-3 border bg-white text-secondary">
            <span class="fs-5 fw-bold">⬅️</span>
        </a>
        <h4 class="fw-bold text-dark mb-0">🗺️ Route Playback</h4>
    </div>
    <small class="text-muted d-block mb-3 ps-2">{{ employee.name }} | {{ target_date|date:"d M Y" }}</small>

    <!-- Top Dashboard for Distance -->
    <div class="card border-0 shadow-sm bg-white mb-3" style="border-left: 4px solid #0d6efd !important;">
        <div class="card-body p-3 d-flex justify-content-between align-items-center">
            <div>
                <h6 class="fw-bold text-dark mb-0">Total Distance Traveled</h6>
                <small class="text-muted">Calculated via GPS Waypoints</small>
            </div>
            <div class="bg-primary bg-opacity-10 text-primary rounded-3 px-3 py-2 text-center border border-primary border-opacity-25">
                <h4 class="fw-bold mb-0" id="totalKm">0.0</h4>
                <small class="text-uppercase" style="font-size: 0.65rem; font-weight: 700;">Kilometers</small>
            </div>
        </div>
    </div>

    <!-- 🗺️ The Map Container -->
    <div class="card border-0 shadow-sm mb-4">
        <div id="map" style="height: 400px; width: 100%; border-radius: 8px; z-index: 1;"></div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var hasData = "{{ has_data }}" === "True";
    
    if (!hasData) {
        document.getElementById('map').innerHTML = "<div class='d-flex h-100 justify-content-center align-items-center text-muted fw-bold'>No GPS data available for this date.</div>";
        return;
    }

    // Backend se aaya JSON Data
    var waypoints = JSON.parse('{{ waypoints_json|safe }}');
    
    // Map Initialize karna (Default Center India)
    var map = L.map('map').setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap SFA'
    }).addTo(map);

    var latlngs = [];
    var totalDistance = 0;

    // Haversine Formula for Distance Calculation (in Km)
    function getDistance(lat1, lon1, lat2, lon2) {
        var R = 6371; // Earth Radius in Km
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLon = (lon2 - lon1) * Math.PI / 180;
        var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // Custom Icons (Green=Start, Blue=Visit, Red=End)
    var greenIcon = new L.Icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });
    
    var redIcon = new L.Icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    // Drawing Markers & Path
    for (var i = 0; i < waypoints.length; i++) {
        var wp = waypoints[i];
        var pos = [wp.lat, wp.lng];
        latlngs.push(pos);

        // Distance Calculation
        if (i > 0) {
            totalDistance += getDistance(waypoints[i-1].lat, waypoints[i-1].lng, wp.lat, wp.lng);
        }

        // Setup Icon Based on Type
        var useIcon = new L.Icon.Default(); // Blue for visits
        if (wp.type === 'start') useIcon = greenIcon;
        if (wp.type === 'end') useIcon = redIcon;

        var marker = L.marker(pos, {icon: useIcon}).addTo(map);
        marker.bindPopup("<b>" + wp.title + "</b><br>Time: " + wp.time);
    }

    // Draw Polyline (The Route Path)
    var polyline = L.polyline(latlngs, {color: '#0d6efd', weight: 4, dashArray: '10, 10'}).addTo(map);

    // Auto-Zoom to fit all points
    if (latlngs.length > 0) {
        map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
    }

    // Update Dashboard UI
    document.getElementById('totalKm').innerText = totalDistance.toFixed(2);
});
</script>
{% endblock %}
