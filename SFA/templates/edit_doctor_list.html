{% extends 'base.html' %}
{% block content %}
{% if is_manager_view %}
<form method="GET" class="mb-3">
    <div class="row align-items-end">
        <div class="col-md-4">
            <label class="form-label fw-bold">Select Team Member:</label>
            <select name="employee_id" class="form-select" onchange="this.form.submit()">
                {% for emp in team_employees %}
                <option value="{{ emp.id }}" {% if emp.id == selected_emp_id %}selected{% endif %}>
                    {{ emp.name }} ({{ emp.designation }})
                </option>
                {% endfor %}
            </select>
        </div>
    </div>
</form>
{% endif %}

<div class="container-fluid p-0 mb-4">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a href="{% url 'edit_hub' %}" class="btn btn-light shadow-sm btn-sm px-2.5 py-1 rounded-3 border bg-white">⬅️</a>
        <h4 class="fw-bold text-dark mb-0">👨‍⚕️ Select Doctor to Edit</h4>
    </div>

    <input type="text" id="docSearch" class="form-control mb-3 fw-bold shadow-sm" placeholder="🔍 Search Doctor Name..." onkeyup="filterDocs()">

    <div class="row g-2" id="docList">
        {% for doc in doctors %}
        <div class="col-12 doc-item">
            <div class="card border-0 shadow-sm bg-white" style="border-left: 4px solid #0056b3;">
                <div class="card-body p-3 d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold text-dark mb-0 doc-name">Dr. {{ doc.name }}</h6>
                        <small class="text-muted">🩺 {{ doc.specialty|default:"Specialty Missing" }} | 🎓 {{ doc.degree|default:"Degree Missing" }}</small>
                    </div>
                    <a href="{% url 'edit_doctor' doc.id %}" class="btn btn-sm btn-outline-primary fw-bold">✏️ Edit</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    function filterDocs() {
        var input = document.getElementById("docSearch").value.toLowerCase();
        var items = document.querySelectorAll('.doc-item');
        items.forEach(function(item) {
            var name = item.querySelector('.doc-name').innerText.toLowerCase();
            item.style.display = name.includes(input) ? 'block' : 'none';
        });
    }
</script>
{% endblock %}
